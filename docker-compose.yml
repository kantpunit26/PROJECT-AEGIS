version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: aegis_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-aegis_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aegis_pgdata:/var/lib/postgresql/data
      - ./deploy/scripts/init_db.sh:/docker-entrypoint-initdb.d/init_db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegis} -d ${POSTGRES_DB:-aegis_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aegis_network

  redis:
    image: redis:7-alpine
    container_name: aegis_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - aegis_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aegis_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegis_backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-aegis}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aegis_secure_password_2026}
      - POSTGRES_DB=${POSTGRES_DB:-aegis_db}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD:-aegis_secure_password_2026}@db:5432/${POSTGRES_DB:-aegis_db}
      - USE_SQLITE_FALLBACK=False
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-aegis_dev_secret_key_change_in_production_8941279841289412}
      - DATA_ROOT=/app/data
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - aegis_network

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegis_celery_worker
    restart: unless-stopped
    command: celery -A app.core.celery_app.celery worker --loglevel=info --concurrency=4
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-aegis}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aegis_secure_password_2026}
      - POSTGRES_DB=${POSTGRES_DB:-aegis_db}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD:-aegis_secure_password_2026}@db:5432/${POSTGRES_DB:-aegis_db}
      - USE_SQLITE_FALLBACK=False
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATA_ROOT=/app/data
    volumes:
      - ./backend:/app
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aegis_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aegis_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - aegis_network

volumes:
  aegis_pgdata:
    driver: local
  aegis_redisdata:
    driver: local

networks:
  aegis_network:
    driver: bridge
